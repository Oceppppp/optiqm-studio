[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optiqm-studio"
version = "1.0.0"
description = "Suite Metode Kuantitatif & Manajemen Operasi (alternatif modern POM-QM)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "networkx>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
desktop = ["pywebview>=5", "pyinstaller>=6"]

[project.scripts]
optiqm = "optiqm.__main__:main"

[tool.setuptools.packages.find]
include = ["optiqm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.vercel]
entrypoint = "main:app"
