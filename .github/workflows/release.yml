name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: OptiQM-Studio-Windows
          - os: macos-latest
            artifact: OptiQM-Studio-macOS
          - os: ubuntu-latest
            artifact: OptiQM-Studio-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Install backend & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[desktop]"
      - name: Build desktop executable
        run: pyinstaller --noconfirm desktop/optiqm.spec
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p release_pkg
          cp -r dist/* release_pkg/
          cp -r samples release_pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release_pkg/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
